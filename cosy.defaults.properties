# Cosy Home settings. To change one, copy this file to cosy.properties, edit it there, then run
# ./install.sh again. Any key you leave out of cosy.properties keeps the value below.
# Package names: `adb shell pm list packages`. Lists are comma-separated.

# Your town, for the weather line and the sunrise and sunset times. Find the coordinates with
#   curl "https://geocoding-api.open-meteo.com/v1/search?name=Cardiff&count=1"
# With no coordinates there is no weather line, and the scene changes at fixed times instead:
# dawn from 06:20, day from 07:50, dusk from 18:10 and night from 19:40.
location.name=
location.latitude=
location.longitude=

# The weather line's unit: celsius or fahrenheit. Any other value means celsius.
weather.temperature_unit=celsius

# The apps on the clock screen, in order. Six fit. Cosy Home skips apps that aren't installed.
dock=com.netflix.ninja,com.amazon.amazonvideo.livingroom,com.disney.disneyplus,com.google.android.youtube.tv,com.plexapp.android,com.spotify.tv.android

# Next in the apps grid after the dock apps. Everything else follows alphabetically.
pinned=

# Never shown as tiles. The defaults are Philips system apps; Live TV and USB media are in the
# Inputs strip instead.
hidden=org.droidtv.playtv,org.droidtv.channels,org.droidtv.contentexplorer,org.droidtv.eum,io.mimi.tvapp,com.vewd.core.browserui,com.phorus.playfi.tv

# The apps the Live TV and USB chips open. These are the Philips ones; on other TVs, set your
# own. Cosy Home hides a chip when its app isn't installed.
live_tv_package=org.droidtv.playtv
usb_package=org.droidtv.contentexplorer

# The screen the Ambilight chip opens. Cosy Home hides the chip on TVs without it.
ambilight_action=org.droidtv.action.AMBILIGHT_OSD
